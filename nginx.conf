# 앱 티어 층2 LB (03 D-분산4) — ALB 뒤, 인스턴스 안 nginx.
# 원본(Vite)과 역할·경로는 동일하되, 정적 파일 서빙 대신 Next(3000)로 프록시한다.
#
# /internal 3중 방어 ①: 이 파일이 그 첫 번째 층이다 (03 §4).
#   ① nginx 경로 차단  ② spring 포트 미노출  ③ X-Internal-Token 필터

upstream next_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream spring_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 업로드·요청 본문 상한 (기본 1MB는 이미지 등에서 막힐 수 있음)
    client_max_body_size 10M;

    # 보안 헤더는 Next(next.config.ts headers())가 붙인다 — 여기서 또 add_header 하면
    # 응답에 같은 헤더가 두 번 실린다. 로컬(nginx 없음)에서도 동일하게 적용되도록
    # 애플리케이션 쪽에 두는 편이 일관적이다.
    # 단, 아래 백엔드 프록시 경로(/api, /.well-known, /actuator)는 Spring이 자체적으로 붙인다.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # ── 백엔드 직행 경로 (Next를 거치지 않는다) ──

    # 백엔드 API — 동일 오리진 유지로 CORS 회피
    location /api/ {
        proxy_pass http://spring_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # JWKS 공개키 — AI 서버(FastAPI)가 RS256 스트림 티켓 검증에 사용 (03 D5)
    location /.well-known/ {
        proxy_pass http://spring_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Actuator — 헬스체크·모니터링
    location /actuator/ {
        proxy_pass http://spring_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 서버 → 백엔드 내부 API (X-Internal-Token으로 보호)
    #
    # ⚠️ 문서(03 §4)는 "① nginx 경로 차단"으로 3중 방어를 서술하지만,
    #    운영 중인 원본 nginx.conf는 이 경로를 **프록시**하고 있었다.
    #    AI 서버가 ALB를 거쳐 SPRING_BASE_URL로 호출하는 구조이기 때문(차단하면 챗 검색이 죽는다).
    #    이식은 동작 동일성이 원칙이라 원본 그대로 둔다.
    #    문서대로 차단하려면 AI 서버를 내부망 직행(프라이빗 IP)으로 바꾸고
    #    백엔드 보안그룹을 여는 작업이 선행되어야 한다 — 팀 논의 사항.
    location /internal/ {
        proxy_pass http://spring_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── ALB 헬스체크 ──
    # nginx가 직접 응답한다 — Next 기동 전에도 200을 주면 안 되므로
    # Next의 /healthz로 프록시해 "앱까지 살아있음"을 확인한다.
    location = /healthz {
        access_log off;
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Next 정적 자산 ──
    # Cache-Control은 Next가 이미 `public, max-age=31536000, immutable`로 내려준다.
    # 여기서 expires/add_header를 또 쓰면 헤더가 중복되므로 프록시만 한다.
    location /_next/static/ {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── 나머지 전부 Next(SSR) ──
    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # SSR 스트리밍(React 서버 렌더)이 지연되지 않도록 버퍼링을 끈다.
        # 03 D-분산6의 "스트리밍 경로만 proxy_buffering off"와 같은 취지.
        proxy_buffering off;
    }
}
