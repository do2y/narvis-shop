# Next.js 앱 배포 워크플로 — **아직 활성화하지 않음**
#
# 활성화 방법 (전환 시점에):
#   1. 브라우저에서 jarvis-web-next 수동 검증 완료 (로그인·결제·챗봇 실사용)
#   2. 이 파일을 `deploy-next.yml`로 rename
#   3. 기존 `deploy.yml`을 `deploy.yml.disabled`로 rename (동시 배포 방지)
#   4. main에 푸시 → Next 앱이 배포됨
#
# 롤백: 3·2번을 되돌리고 푸시. 또는 EC2에서 이전 이미지 해시로 docker run.
#
# 기존 deploy.yml과의 차이는 두 줄뿐이다:
#   - context: jarvis-web-next  (Dockerfile 위치)
#   - -e API_PROXY_TARGET=...   (standalone 서버는 .env를 읽지 않음)

name: Jarvis Frontend CI/CD (Next.js)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          # 레포 루트가 아니라 Next 앱 폴더가 빌드 컨텍스트다.
          # 레포를 교체하면 `.`으로 되돌린다.
          context: jarvis-web-next
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        server: [EC2_HOST, EC2_HOST_2]
    steps:
      - name: EC2 무중단 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.server] }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            docker stop jarvis-frontend || true
            docker rm -f jarvis-frontend || true

            # --network host — 컨테이너가 EC2 호스트 네트워크를 그대로 쓴다.
            # 그래서 API_PROXY_TARGET의 localhost:8080이 호스트의 Spring을 가리킨다.
            # (bridge로 바꾸면 localhost는 컨테이너 자신이 되므로 이 값도 함께 바꿀 것)
            #
            # API_PROXY_TARGET: Next 서버(app/api/[...path] 프록시)가 백엔드를 부를 주소.
            # standalone 서버는 .env 파일을 읽지 않으므로 명시 주입한다.
            docker run -d \
              --name jarvis-frontend \
              --restart always \
              --network host \
              -e API_PROXY_TARGET="http://localhost:8080" \
              ${{ env.IMAGE }}:${{ github.sha }}

            # 헬스체크 — Next 라우트 핸들러(app/healthz)가 응답한다.
            # nginx 때보다 기동이 느리므로(SSR 서버 부팅) 대기를 60초로 늘린다.
            for i in $(seq 1 30); do
              if curl -fs http://localhost/healthz > /dev/null; then
                docker image prune -f
                exit 0
              fi
              sleep 2
            done
            docker logs --tail 50 jarvis-frontend
            exit 1
