name: Jarvis Frontend CI/CD


on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        server: [EC2_HOST, EC2_HOST_2]
    steps:
      - name: EC2 무중단 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.server] }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            docker stop jarvis-frontend || true
            docker rm -f jarvis-frontend || true

            # --network host — 컨테이너가 EC2 호스트 네트워크를 그대로 쓴다.
            # 그래서 API_PROXY_TARGET의 localhost:8080이 호스트의 Spring을 가리킨다.
            # (bridge로 바꾸면 localhost는 컨테이너 자신이 되므로 이 값도 함께 바꿀 것)
            #
            # API_PROXY_TARGET: Next 서버(app/api/[...path] 프록시)가 백엔드를 부를 주소.
            # standalone 서버는 .env 파일을 읽지 않으므로 명시 주입한다.
            docker run -d \
              --name jarvis-frontend \
              --restart always \
              --network host \
              -e API_PROXY_TARGET="http://localhost:8080" \
              ${{ env.IMAGE }}:${{ github.sha }}

            # 헬스체크 — nginx(80) → Next(3000)의 /healthz로 프록시된다.
            # 즉 nginx와 Next가 **둘 다** 떠야 200이 나온다(부분 기동 상태를 걸러냄).
            # SSR 서버 부팅이 nginx보다 느리므로 대기를 60초로 늘린다.
            for i in $(seq 1 30); do
              if curl -fs http://localhost/healthz > /dev/null; then
                docker image prune -f
                exit 0
              fi
              sleep 2
            done
            docker logs --tail 50 jarvis-frontend
            exit 1
